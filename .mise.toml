[tools]
node = "22"

[tasks.dev]
description = "Start development server"
run = "npm run dev"

[tasks.build]
description = "Build static site"
run = "npm run build"

[tasks.preview]
description = "Preview built site"
run = "npm run preview"

[tasks.check]
description = "Type-check the project"
run = "npm run check"

[tasks.test]
description = "Run Playwright e2e responsiveness tests"
run = "npm run test:e2e"

[tasks."test:ui"]
description = "Run Playwright e2e tests in UI mode"
run = "npm run test:e2e:ui"