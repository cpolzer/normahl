name: SFTP setup
description: Install lftp and trust the SFTP server's host key
inputs:
  host:
    required: true
  port:
    required: false
    default: "22"
  known-hosts:
    description: Pinned known_hosts line(s); if empty, falls back to ssh-keyscan (TOFU) with a warning
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install lftp
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

    - name: Trust SFTP host key
      shell: bash
      env:
        SFTP_HOST: ${{ inputs.host }}
        SFTP_PORT: ${{ inputs.port }}
        SFTP_KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        mkdir -p ~/.ssh
        if [ -n "$SFTP_KNOWN_HOSTS" ]; then
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
        else
          echo "::warning::SFTP_KNOWN_HOSTS secret not set; trusting host key fetched via ssh-keyscan"
          ssh-keyscan -p "${SFTP_PORT:-22}" "$SFTP_HOST" > ~/.ssh/known_hosts
        fi
