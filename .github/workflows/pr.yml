name: PR checks

# pull_request (NOT pull_request_target): PR code never runs with secrets
# from forks. Fork PRs get no secrets, so the login check skips itself.
#
# Same-repo branch PRs DO get secrets and run this repo's local action from
# the PR branch, so only people with push access should be trusted here; add
# an environment approval rule if outside collaborators join.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sftp-login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets are available
        id: secrets
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          if [ -z "$SFTP_HOST" ]; then
            echo "::notice::SFTP secrets unavailable (fork PR or not configured); skipping login check"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: SFTP setup
        if: steps.secrets.outputs.available == 'true'
        uses: ./.github/actions/sftp-setup
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          known-hosts: ${{ secrets.SFTP_KNOWN_HOSTS }}

      # Read-only: log in and list the start directory.
      - name: Test SFTP login
        if: steps.secrets.outputs.available == 'true'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp --env-password -u "$SFTP_USERNAME" -p "${SFTP_PORT:-22}" "sftp://$SFTP_HOST" -e "
            set cmd:fail-exit yes;
            set sftp:auto-confirm no;
            set net:max-retries 1;
            set net:timeout 20;
            cls -1 .;
            bye
          "
          echo "SFTP login OK"
